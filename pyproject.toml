[project]
name = "knowledge-tracing"
version = "2.0.0"
description = "Automated ML pipeline for Knowledge Tracing on the ASSISTments 2009 dataset (BKT, DKT+Optuna, FLAML AutoML)."
authors = [{ name = "Ekaterina Grigoreva" }]
readme = "README.md"
# Pinned to the interpreter used by the Docker image and CI.
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy (>=1.24,<2.2)",
    "pandas (>=2.0,<3.0)",
    "pyarrow (>=14.0,<26.0)",
    "scikit-learn (>=1.3,<2.0)",
    "scipy (>=1.10,<2.0)",
    "matplotlib (>=3.7,<4.0)",
    "seaborn (>=0.13,<0.14)",
    "pyyaml (>=6.0,<7.0)",
    "mlflow (>=2.9,<4.0)",
    "psutil (>=5.9,<8.0)",
    "flaml[automl] (>=2.1,<3.0)",
    "lightgbm (>=4.0,<5.0)",
    "xgboost (>=2.0,<3.0)",
    "optuna (>=3.4,<6.0)",
    # torch >= 2.7 segfaults on macOS arm64 when loaded next to lightgbm/xgboost
    # (duplicate libomp), so the 2.6 line is kept.
    "torch (>=2.6,<2.7)",
    "requests (>=2.31,<3.0)",
    "pydantic (>=2.5,<3.0)",
]

[build-system]
requires = ["poetry-core>=2.0,<3.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "knowledge_tracing", from = "src" }]

[tool.poetry.dependencies]
# Linux (Docker image, CI) gets CPU-only wheels without the ~1 GB CUDA payload;
# macOS uses the regular PyPI wheels.
torch = [
    { markers = "sys_platform == 'linux'", source = "pytorch-cpu" },
    { markers = "sys_platform != 'linux'" },
]

[[tool.poetry.source]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0,<10.0"
pytest-cov = ">=5.0,<8.0"
ruff = ">=0.16,<0.17"
mypy = ">=2.0,<3.0"
pre-commit = ">=4.0,<5.0"
pandas-stubs = ">=2.2,<3.0"
types-pyyaml = ">=6.0,<7.0"
types-psutil = ">=7.0,<8.0"
types-requests = ">=2.31,<3.0"

[tool.poetry.group.notebook]
optional = true

[tool.poetry.group.notebook.dependencies]
ipykernel = ">=6.29,<8.0"

[tool.poetry.group.presentation]
optional = true

[tool.poetry.group.presentation.dependencies]
python-pptx = ">=0.6.21,<2.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "slow: marks tests that train models (deselect with '-m \"not slow\"')",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "UP",      # pyupgrade
    "B",       # flake8-bugbear
    "SIM",     # flake8-simplify
    "C4",      # flake8-comprehensions
    "PTH",     # flake8-use-pathlib
    "N",       # pep8-naming
    "S",       # flake8-bandit (security)
    "T20",     # flake8-print
    "NPY",     # NumPy-specific rules
    "RUF",     # Ruff-specific rules
]
ignore = [
    "E501",                        # line length is handled by the formatter
    "RUF001", "RUF002", "RUF003",  # Cyrillic and typographic characters are intentional
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]           # pytest relies on plain asserts
"scripts/**" = ["T20"]          # command-line scripts report via print
"notebooks/**" = ["T20", "E402"]  # notebooks report via print; imports follow the setup cell

[tool.ruff.lint.pep8-naming]
# Conventional ML names: feature matrices (X_train, Xtr) and sequence/batch sizes (T, B, L).
extend-ignore-names = ["X", "X_*", "Xtr", "Xva", "Xte", "T", "B", "L"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
mypy_path = "src"
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
warn_redundant_casts = true
warn_unused_ignores = true
pretty = true

[[tool.mypy.overrides]]
# Third-party libraries without type information.
module = ["sklearn.*", "flaml.*", "seaborn.*", "scipy.*", "lightgbm.*", "xgboost.*", "pptx.*"]
ignore_missing_imports = true
