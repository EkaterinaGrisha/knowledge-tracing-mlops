[project]
name = "ml-pipeline-knowledge-tracing"
version = "1.0.0"
description = "Automated ML pipeline for Knowledge Tracing on the ASSISTments 2009 dataset (BKT, DKT+Optuna, FLAML AutoML)."
authors = [{ name = "Ekaterina Grigoreva" }]
readme = "README.md"
# Pinned to the interpreter used by the Docker image and CI.
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy (>=1.24,<2.2)",
    "pandas (>=2.0,<3.0)",
    "pyarrow (>=14.0,<26.0)",
    "scikit-learn (>=1.3,<2.0)",
    "scipy (>=1.10,<2.0)",
    "matplotlib (>=3.7,<4.0)",
    "seaborn (>=0.13,<0.14)",
    "pyyaml (>=6.0,<7.0)",
    "mlflow (>=2.9,<4.0)",
    "psutil (>=5.9,<8.0)",
    "flaml[automl] (>=2.1,<3.0)",
    "lightgbm (>=4.0,<5.0)",
    "xgboost (>=2.0,<3.0)",
    "optuna (>=3.4,<6.0)",
    # torch >= 2.7 segfaults on macOS arm64 when loaded next to lightgbm/xgboost
    # (duplicate libomp), so the 2.6 line is kept.
    "torch (>=2.6,<2.7)",
    "requests (>=2.31,<3.0)",
]

[tool.poetry]
# Dependencies only for now: the code is still imported as the `src` namespace.
package-mode = false

[tool.poetry.dependencies]
# Linux (Docker image, CI) gets CPU-only wheels without the ~1 GB CUDA payload;
# macOS uses the regular PyPI wheels.
torch = [
    { markers = "sys_platform == 'linux'", source = "pytorch-cpu" },
    { markers = "sys_platform != 'linux'", source = "pypi" },
]

[[tool.poetry.source]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0,<10.0"
pytest-cov = ">=5.0,<8.0"
ruff = ">=0.16,<0.17"
mypy = ">=2.0,<3.0"
pre-commit = ">=4.0,<5.0"
pandas-stubs = ">=2.2,<3.0"
types-pyyaml = ">=6.0,<7.0"
types-requests = ">=2.31,<3.0"

[tool.poetry.group.notebook]
optional = true

[tool.poetry.group.notebook.dependencies]
ipykernel = ">=6.29,<8.0"

[tool.poetry.group.presentation]
optional = true

[tool.poetry.group.presentation.dependencies]
python-pptx = ">=0.6.21,<2.0"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "slow: marks tests that train models (deselect with '-m \"not slow\"')",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
