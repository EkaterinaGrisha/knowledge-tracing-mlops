# Two services:
#   pipeline — runs the ML pipeline, writing artifacts/ (metrics, figures, the
#              packaged model) and mlruns/ (MLflow SQLite store) to the host
#   mlflow   — serves the MLflow UI (runs and Model Registry) over mlruns/
services:
  pipeline:
    build: .
    image: kt-pipeline:latest
    command: ["train", "--data-source", "sample"]
    volumes:
      - ./artifacts:/app/artifacts
      - ./mlruns:/app/mlruns

  mlflow:
    image: kt-pipeline:latest
    entrypoint: ["mlflow", "ui", "--backend-store-uri", "sqlite:////app/mlruns/mlflow.db", "--host", "0.0.0.0", "--port", "5000"]
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/app/mlruns
